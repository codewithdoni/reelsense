<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ReelSense</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="dot"></span>
        <strong>ReelSense</strong>
      </div>
      <div class="lang">
        <select id="lang" title="Script language">
          <option value="uz">Uzbek</option>
          <option value="ru">Russian</option>
          <option value="en">English</option>
        </select>
      </div>
    </header>

    <div id="ctxbar" class="ctxbar">
      <div class="ctx-main">Open an Instagram page…</div>
      <div class="ctx-sub"></div>
    </div>

    <nav class="tabs">
      <button class="tab active" data-tab="profile">Profile</button>
      <button class="tab" data-tab="reel">Reel</button>
      <button class="tab" data-tab="competitor">Competitor</button>
      <button class="tab" data-tab="ideas">Ideas</button>
      <button class="tab" data-tab="auto">Automations</button>
      <button class="tab" data-tab="chat">Chat</button>
    </nav>

    <main id="views">
      <section class="view active" id="view-profile"></section>
      <section class="view" id="view-reel"></section>
      <section class="view" id="view-competitor"></section>
      <section class="view" id="view-ideas"></section>
      <section class="view" id="view-auto"></section>
      <section class="view" id="view-chat"></section>
    </main>

    <footer class="statusbar"><span id="status">ready</span></footer>

    <script type="module" src="panel.js"></script>
  </body>
</html>
